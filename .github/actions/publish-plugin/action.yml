name: Publish plugin package
description: Publish and verify one protected plugin package

inputs:
  product_id:
    required: true
  version:
    required: true
  archive_name:
    required: true
  sha256:
    required: true
  release_stage:
    required: true
  destination:
    required: true
  webhook_enabled:
    required: true
  automation_path:
    required: false
    default: .release-automation
  r2_access_key_id:
    required: true
  r2_secret_access_key:
    required: true
  r2_endpoint:
    required: true
  r2_bucket:
    required: true
  r2_public_base_url:
    required: true
  r2_object_prefix:
    required: true
  tencent_secret_id:
    required: true
  tencent_secret_key:
    required: true
  tencent_cos_bucket:
    required: true
  tencent_cos_region:
    required: true
  tencent_public_base_url:
    required: true
  update_webhook_key:
    required: false
  update_product_name:
    required: true
  call_admin_webhook:
    required: true
  github_token:
    required: true

runs:
  using: composite
  steps:
    - name: Download protected package
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: release-${{ inputs.product_id }}-${{ inputs.version }}
        path: artifacts

    - name: Validate deployment configuration
      shell: pwsh
      env:
        R2_ACCESS_KEY_ID: ${{ inputs.r2_access_key_id }}
        R2_SECRET_ACCESS_KEY: ${{ inputs.r2_secret_access_key }}
        TENCENT_SECRET_ID: ${{ inputs.tencent_secret_id }}
        TENCENT_SECRET_KEY: ${{ inputs.tencent_secret_key }}
        R2_ENDPOINT: ${{ inputs.r2_endpoint }}
        R2_BUCKET: ${{ inputs.r2_bucket }}
        R2_PUBLIC_BASE_URL: ${{ inputs.r2_public_base_url }}
        R2_OBJECT_PREFIX: ${{ inputs.r2_object_prefix }}
        TENCENT_COS_BUCKET: ${{ inputs.tencent_cos_bucket }}
        TENCENT_COS_REGION: ${{ inputs.tencent_cos_region }}
        TENCENT_PUBLIC_BASE_URL: ${{ inputs.tencent_public_base_url }}
      run: |
        $required = @(
          'R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY', 'TENCENT_SECRET_ID',
          'TENCENT_SECRET_KEY', 'R2_ENDPOINT', 'R2_BUCKET', 'R2_PUBLIC_BASE_URL',
          'R2_OBJECT_PREFIX', 'TENCENT_COS_BUCKET', 'TENCENT_COS_REGION',
          'TENCENT_PUBLIC_BASE_URL'
        )
        $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
        if ($missing.Count) {
          throw "Missing deployment configuration: $($missing -join ', ')"
        }

    - name: Prepare exact upload trees
      id: upload
      shell: pwsh
      run: |
        $result = .\${{ inputs.automation_path }}\scripts\New-ReleaseUploadTrees.ps1 `
          -ArchivePath '.\artifacts\${{ inputs.archive_name }}' `
          -Sha256Path '.\artifacts\${{ inputs.archive_name }}.sha256' `
          -ProductId '${{ inputs.product_id }}' `
          -Version '${{ inputs.version }}' `
          -Destination '${{ inputs.destination }}' `
          -ObjectPrefix '${{ inputs.r2_object_prefix }}' `
          -OutputRoot .\upload-trees
        "object_key=$($result.VersionedObjectKey)" >> $env:GITHUB_OUTPUT

    - name: Refuse conflicting immutable objects
      shell: bash
      env:
        EXPECTED_SHA256: ${{ inputs.sha256 }}
        R2_URL: ${{ inputs.r2_public_base_url }}/${{ steps.upload.outputs.object_key }}
        COS_URL: ${{ inputs.tencent_public_base_url }}/${{ steps.upload.outputs.object_key }}
      run: |
        set -euo pipefail
        for url in "$R2_URL" "$COS_URL"; do
          status="$(curl --silent --show-error --location --output existing.zip --write-out '%{http_code}' "$url")"
          if [ "$status" = "200" ]; then
            actual="$(sha256sum existing.zip | awk '{print $1}')"
            if [ "$actual" != "$EXPECTED_SHA256" ]; then
              echo "::error::Immutable object already exists with a different checksum: $url"
              exit 1
            fi
          elif [ "$status" != "404" ]; then
            echo "::error::Unexpected preflight HTTP status $status for $url"
            exit 1
          fi
        done

    - name: Upload to Cloudflare R2
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.r2_access_key_id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.r2_secret_access_key }}
        AWS_DEFAULT_REGION: auto
        R2_ENDPOINT: ${{ inputs.r2_endpoint }}
        R2_BUCKET: ${{ inputs.r2_bucket }}
      run: |
        set -euo pipefail
        aws s3 cp ./upload-trees/r2 "s3://${R2_BUCKET}/" \
          --recursive \
          --endpoint-url "$R2_ENDPOINT" \
          --no-progress

    - name: Upload to Tencent COS with verified COSCLI
      shell: bash
      env:
        TENCENT_SECRET_ID: ${{ inputs.tencent_secret_id }}
        TENCENT_SECRET_KEY: ${{ inputs.tencent_secret_key }}
        TENCENT_COS_BUCKET: ${{ inputs.tencent_cos_bucket }}
        TENCENT_COS_REGION: ${{ inputs.tencent_cos_region }}
      run: |
        set -euo pipefail
        curl \
          --fail \
          --location \
          --silent \
          --show-error \
          --output coscli \
          https://github.com/tencentyun/coscli/releases/download/v1.0.8/coscli-v1.0.8-linux-amd64
        echo "7165f2ae16c5f7ac495864c963ca574a76e04ec72680d7bc8a8eee3234d8cf91  coscli" |
          sha256sum --check
        chmod 755 coscli
        ./coscli cp \
          ./upload-trees/cos/ \
          "cos://${TENCENT_COS_BUCKET}/" \
          --recursive \
          --endpoint "cos.${TENCENT_COS_REGION}.myqcloud.com" \
          --secret-id "$TENCENT_SECRET_ID" \
          --secret-key "$TENCENT_SECRET_KEY" \
          --init-skip \
          --disable-log \
          --bucket-type COS \
          --err-retry-num 3 \
          --err-retry-interval 3

    - name: Verify byte-identical public downloads
      shell: pwsh
      run: |
        .\${{ inputs.automation_path }}\scripts\Test-RemoteReleaseArtifact.ps1 `
          -Uri '${{ inputs.r2_public_base_url }}/${{ steps.upload.outputs.object_key }}' `
          -ExpectedSha256 '${{ inputs.sha256 }}'
        .\${{ inputs.automation_path }}\scripts\Test-RemoteReleaseArtifact.ps1 `
          -Uri '${{ inputs.tencent_public_base_url }}/${{ steps.upload.outputs.object_key }}' `
          -ExpectedSha256 '${{ inputs.sha256 }}'

    - name: Create or update GitHub Release
      if: startsWith(inputs.release_stage, 'production')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        TAG_NAME: ${{ github.ref_name }}
        VERSION: ${{ inputs.version }}
        PRODUCT_ID: ${{ inputs.product_id }}
        ARCHIVE_NAME: ${{ inputs.archive_name }}
        SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$TAG_NAME" \
            "artifacts/$ARCHIVE_NAME" \
            "artifacts/$ARCHIVE_NAME.sha256" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
        else
          gh release create "$TAG_NAME" \
            "artifacts/$ARCHIVE_NAME" \
            "artifacts/$ARCHIVE_NAME.sha256" \
            --verify-tag \
            --title "$PRODUCT_ID $VERSION" \
            --notes "SHA-256: \`$SHA256\`" \
            --repo "$GITHUB_REPOSITORY"
        fi

    - name: Notify update service
      if: >-
        inputs.release_stage == 'production-with-webhook' &&
        inputs.webhook_enabled == 'true' &&
        inputs.call_admin_webhook == 'true'
      shell: bash
      env:
        UPDATE_WEBHOOK_KEY: ${{ inputs.update_webhook_key }}
        PRODUCT_NAME: ${{ inputs.update_product_name }}
      run: |
        set -euo pipefail
        if [ -z "$UPDATE_WEBHOOK_KEY" ] || [ -z "$PRODUCT_NAME" ]; then
          echo "::error::Webhook configuration is incomplete."
          exit 1
        fi
        curl \
          --fail-with-body \
          --silent \
          --show-error \
          --max-time 30 \
          --request POST \
          --data-urlencode "secret=${UPDATE_WEBHOOK_KEY}" \
          "http://update.ffxivbots.com:8080/Webhooks?product=${PRODUCT_NAME}"

    - name: Write release summary
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SHA256: ${{ inputs.sha256 }}
        OBJECT_KEY: ${{ steps.upload.outputs.object_key }}
        R2_BASE: ${{ inputs.r2_public_base_url }}
        COS_BASE: ${{ inputs.tencent_public_base_url }}
      run: |
        {
          echo "### ${{ inputs.product_id }} $VERSION"
          echo
          echo "- Stage: \`${{ inputs.release_stage }}\`"
          echo "- SHA-256: \`$SHA256\`"
          echo "- R2: $R2_BASE/$OBJECT_KEY"
          echo "- Tencent COS: $COS_BASE/$OBJECT_KEY"
        } >> "$GITHUB_STEP_SUMMARY"
